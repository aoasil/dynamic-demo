name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Win64
            os: ubuntu-latest
          - target: Android32
            os: ubuntu-latest
          - target: Android64
            os: ubuntu-latest
          - target: iOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-demo-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error